<section #root
  class="relative h-dvh w-full overflow-hidden bg-[#05030a] font-['Quicksand'] text-white outline-none select-none [container-type:size]"
  tabindex="-1" aria-label="Thiệp 20/10 — Bó hoa giữa trời sao">
  <!-- Night sky glow -->
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_78%_62%_at_50%_46%,#160a1f_0%,rgba(22,10,31,0.55)_46%,rgba(5,3,10,0)_100%)]"
    aria-hidden="true"></div>

  <canvas #skyCanvas
    class="absolute inset-0 block h-full w-full touch-none transition-opacity duration-[1400ms] ease-out motion-reduce:transition-none"
    [class.opacity-0]="!sceneReady()" aria-hidden="true"></canvas>

  @if (phase() !== 'sky') {
  <!-- Bouquet stage: a tap makes the photos bloom out of the roses, then the gift opens by itself -->
  <div
    class="pointer-events-none absolute inset-0 flex items-center justify-center transition-[opacity,scale] duration-[1200ms] ease-[cubic-bezier(.22,.75,.25,1)] motion-reduce:transition-none"
    [class.opacity-0]="phase() === 'opening'" [style.scale]="phase() === 'opening' ? 1.06 : 1">
    <!-- No context menu / image drag on the artwork: a long press must not offer "save image" -->
    <div class="flex touch-manipulation flex-col items-center select-none [-webkit-touch-callout:none]"
      [class.pointer-events-auto]="phase() !== 'opening'" (click)="onStageClick()"
      (contextmenu)="$event.preventDefault()" (dragstart)="$event.preventDefault()">
      <div class="relative w-[min(86cqw,calc((100cqh_-_120px)_/_1.28),440px)]">
        <div
          class="pointer-events-none absolute -inset-[22%] bg-[radial-gradient(closest-side,rgba(255,122,182,0.36),rgba(255,122,182,0.13)_55%,rgba(255,122,182,0)_100%)] transition-[opacity,scale] duration-1200 ease-out motion-reduce:transition-none"
          [style.opacity]="glow().opacity" [style.scale]="glow().scale" aria-hidden="true"></div>
        <button #bouquetButton type="button"
          class="relative block w-full cursor-pointer select-none rounded-lg bg-transparent p-0 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#ff8fbf]"
          [attr.aria-label]="bouquetLabel()" [attr.tabindex]="phase() === 'opening' ? -1 : null"
          (keydown)="onBouquetKeydown($event)">
          <app-women-day-bouquet-art class="block w-full" [photos]="bouquetPhotos()"
            [revealed]="revealed()"></app-women-day-bouquet-art>
        </button>
      </div>
      <p
        class="mt-3 h-5 text-center text-[14px] font-medium leading-5 tracking-[0.04em] text-[#ffd6e7] [text-shadow:0_0_12px_rgba(255,105,180,0.55)] motion-safe:animate-pulse"
        aria-hidden="true">{{ hintText() }}</p>
    </div>
  </div>
  }

  @if (envelopeVisible()) {
  <!-- Top-left: the page's music button owns the top-right corner -->
  <div
    class="fixed left-[max(1rem,env(safe-area-inset-left))] top-[max(1rem,env(safe-area-inset-top))] z-40 flex items-center gap-2.5">
    <button #envelopeButton type="button"
      class="relative flex h-10 w-[52px] items-center justify-center gap-1 rounded-lg border border-white/18 bg-white/8 text-[#ff8fbf] shadow-[0_8px_28px_rgba(255,105,180,0.22)] backdrop-blur-md transition-[opacity,translate,background-color,border-color] duration-500 ease-out hover:border-white/30 hover:bg-white/14 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#ff8fbf] starting:-translate-y-2 starting:opacity-0 motion-reduce:transition-none"
      aria-label="Mở lá thư" aria-haspopup="dialog" [attr.aria-expanded]="letterOpen()" (click)="openLetter()">
      <svg viewBox="0 0 24 24" class="h-[18px] w-[18px] shrink-0" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.2 5.5h13.6c.94 0 1.7.76 1.7 1.7v9.6c0 .94-.76 1.7-1.7 1.7H5.2c-.94 0-1.7-.76-1.7-1.7V7.2c0-.94.76-1.7 1.7-1.7Z" />
        <path d="m4.3 6.8 7.7 5.9 7.7-5.9" />
      </svg>
      <span class="text-[12px] font-bold leading-none">Thư</span>
      <span class="pointer-events-none absolute -right-1 -top-1 flex h-2.5 w-2.5" aria-hidden="true">
        <span class="absolute inline-flex h-full w-full rounded-full bg-[#ff7ab6] opacity-70 motion-safe:animate-ping"></span>
        <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-[#ff7ab6] shadow-[0_0_8px_rgba(255,105,180,0.9)]"></span>
      </span>
    </button>

    @if (tooltip() !== 'hidden') {
    <div
      class="pointer-events-none relative whitespace-nowrap rounded-md border border-white/14 bg-[#1a0d1f]/85 px-3 py-1.5 text-[13px] font-medium text-[#ffd6e7] shadow-[0_6px_20px_rgba(0,0,0,0.35)] backdrop-blur-md transition-[opacity,translate] duration-500 ease-out starting:-translate-x-1 starting:opacity-0 motion-reduce:transition-none"
      [class.opacity-0]="tooltip() === 'leaving'" aria-hidden="true">
      <span
        class="absolute -left-[5px] top-1/2 h-2.5 w-[5px] -translate-y-1/2 bg-[#1a0d1f]/85 [clip-path:polygon(100%_0,0_50%,100%_100%)]"></span>
      Bạn có một lá thư 💌
    </div>
    }
  </div>
  }

  <p class="sr-only" aria-live="polite">{{ announcement() }}</p>
</section>

@if (letterMounted()) {
<!-- Outside the select-none root: the letter text and the reply form must stay selectable/editable -->
<app-women-day-letter [open]="letterOpen()" [envelope]="envelope()" [letterText]="letterText()"
  [photoUrl]="letterPhoto()" [senderName]="senderName()" [receiverName]="receiverName()"
  [rsvpQuestion]="rsvpQuestion()" [invitationId]="invitationId()" [isPreview]="isPreview()"
  [showReplies]="showReplies()" [replies]="replies()" (closed)="closeLetter()"></app-women-day-letter>
}
